<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT cue-id styling (video.js)</title>
<link rel="stylesheet" href="assets/videojs/video-js.min.css">
<style>
  body { margin: 0; background: #444; }
  .video-js { width: 640px; height: 360px; }
  /* cue.id is never reflected anywhere in the rendered DOM (no id/data
     attribute on .vjs-text-track-cue or its children) — there is no CSS
     selector capable of targeting an individual cue by id in vanilla
     video.js, so no rules are written here (confirmed by DOM dump). */
</style>
</head>
<body>
<video-js id="v" class="video-js" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="styling-cue-id.vtt" srclang="en" default>
</video-js>
<script src="assets/videojs/video.min.js"></script>
<script>videojs('v', { controls: false });</script>
</body>
</html>
