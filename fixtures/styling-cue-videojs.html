<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT cue styling (video.js)</title>
<link rel="stylesheet" href="assets/videojs/video-js.min.css">
<style>
  body { margin: 0; background: #444; }
  .video-js { width: 640px; height: 360px; }
  .redbg { background-color: red; color: white; }
  /* <v Bob> becomes <span title="Bob">, not a [voice=...] attribute — there
     is no <v> element or "voice" attribute in the rendered DOM at all. */
  [title="Bob"] { background-color: blue; color: white; }
  .highlight { background-color: yellow; color: black; }
  b { background-color: green; color: white; }
</style>
</head>
<body>
<video-js id="v" class="video-js" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="styling-cue.vtt" srclang="en" default>
</video-js>
<script src="assets/videojs/video.min.js"></script>
<script>videojs('v', { controls: false });</script>
</body>
</html>
