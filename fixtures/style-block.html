<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT in-file STYLE block (bare ::cue, class selector, id selector)</title>
<style>
  body { margin: 0; background: #444; }
  video { display: block; width: 640px; height: 360px; }
  /* Deliberately no ::cue rules here — all styling in this fixture must
     come from the STYLE block inside style-block.vtt itself, to isolate
     the in-file STYLE code path from the page-level <style> path already
     covered by every other fixture. */
</style>
</head>
<body>
<video id="v" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="style-block.vtt" srclang="en" default>
</video>
</body>
</html>
