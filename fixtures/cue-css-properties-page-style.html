<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT ::cue CSS properties (background-color vs background-image)</title>
<style>
  body { margin: 0; background: #444; }
  video { display: block; width: 640px; height: 360px; }
  video::cue(.bgcolor) { background-color: red; color: white; }
  /* 20x20 red/blue checkerboard, not a solid color — a 1x1 image would tile
     into a flat fill indistinguishable from background-color. */
  video::cue(.bgimage) {
    background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAO0lEQVR4Aa3BQQEAMAyEMIp/zzcLe5AcbHwYxw+JSUxiEpOYxCQmMYndYHw4xg+JSUxiEpOYxCQmMYk9im4GI651TeEAAAAASUVORK5CYII=);
    color: white;
  }
</style>
</head>
<body>
<video id="v" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="cue-css-properties-page-style.vtt" srclang="en" default>
</video>
</body>
</html>
