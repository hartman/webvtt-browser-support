<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT ::cue(#id) styling</title>
<style>
  body { margin: 0; background: #444; }
  video { display: block; width: 640px; height: 360px; }

  video::cue(#alpha) { background-color: orange; color: black; }
  video::cue(#beta) { background-color: purple; color: white; }
</style>
</head>
<body>
<video id="v" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="styling-cue-id-page-style.vtt" srclang="en" default>
</video>
</body>
</html>
