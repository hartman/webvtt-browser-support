<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebVTT internal timestamps + ::cue(:past)/::cue(:future)</title>
<style>
  body { margin: 0; background: #444; }
  video { display: block; width: 640px; height: 360px; }
</style>
</head>
<body>
<video id="v" width="640" height="360" muted>
  <source src="assets/blank.mp4" type="video/mp4">
  <track kind="subtitles" src="past-future.vtt" srclang="en" default>
</video>
</body>
</html>
